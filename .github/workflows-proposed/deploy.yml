name: Main deploy

# Build main and sync it into the ROOT of the gh-pages state branch, keeping
# any live pr-<n>/ previews intact. The actual GitHub Pages deployment happens
# in publish-pages.yml (workflow_run) — see that file for why the indirection
# exists.

on:
  push:
    branches: [main]
  # A fast-forward merge (see fast-forward.yml) pushes to main with the
  # default GITHUB_TOKEN, which the recursion guard exempts from triggering
  # `push` — so this run wouldn't otherwise fire. workflow_run doesn't have
  # that problem (same reasoning as publish-pages.yml's own workflow_run
  # trigger, see that file): it fires on the upstream workflow's completion,
  # not on what its GITHUB_TOKEN did internally, and fast-forward.yml's own
  # trigger is a human's PR comment, not a GITHUB_TOKEN-authored event. The
  # `if:` below gates this build to only run when that merge succeeded; the
  # checkout step already deploys the main TIP regardless of trigger source.
  workflow_run:
    workflows: ["Fast forward"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write # push to the gh-pages state branch

concurrency:
  group: main-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run: only build after a successful fast-forward merge. push
    # and workflow_dispatch have no workflow_run payload, so let them through.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # Deploy the branch TIP as of run time, not the pushed sha. Push runs
      # can start out of order (seen live 2026-08-03: the run for an older
      # commit was queued ~11 min late, started 21 s after — and, via
      # cancel-in-progress, cancelled — the newer commit's run, then synced
      # the older build over the site root). With the tip checked out, any
      # straggler run redeploys current content, so run ordering can't
      # regress the site; the revision label below follows HEAD and stays
      # truthful. This also means a workflow_run-triggered build (a
      # fast-forward merge) deploys whatever is actually on main now, not a
      # sha tied to the triggering event.
      - name: Check out the current main tip
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: Resolve revision
        id: rev
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build site
        uses: ./.github/actions/build-site
        with:
          revision: ${{ steps.rev.outputs.short }}

      - name: Sync site root into gh-pages branch
        uses: ./.github/actions/sync-pages-branch
        with:
          source-dir: site
          message: "main: deploy ${{ steps.rev.outputs.short }}"
