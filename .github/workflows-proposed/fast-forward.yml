name: Fast forward
on:
  issue_comment:
    types: [created, edited]
jobs:
  fast-forward:
    if: ${{ contains(github.event.comment.body, '/fast-forward') && github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Fast forward the target branch
        uses: sequoia-pgp/fast-forward@v1
        with:
          merge: true
          comment: always
          # Pushes made with the default GITHUB_TOKEN don't trigger `push`
          # workflows (recursion guard), so a fast-forward merge to main
          # would NOT fire deploy.yml. Add a FAST_FORWARD_PAT repo secret
          # (a PAT with contents: write) to make merges deploy the site;
          # until then the fallback token merges without deploying.
          github_token: ${{ secrets.FAST_FORWARD_PAT || secrets.GITHUB_TOKEN }}
