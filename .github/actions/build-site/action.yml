name: Build site
description: >
  Build the WASM release, generate icons, and assemble the deployable site
  into site/ — shared by the main deploy and the per-PR preview deploy.
  (Same pipeline shape as Pegasus, trimmed to this repo's file set.)
inputs:
  revision:
    description: Revision label injected into index.html (__GIT_REVISION__).
    required: true
runs:
  using: composite
  steps:
    - name: Install Rust wasm target
      shell: bash
      run: rustup target add wasm32-unknown-unknown

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Build WASM
      shell: bash
      run: cargo build --release --target wasm32-unknown-unknown

    - name: Generate app icons
      shell: bash
      run: |
        sudo apt-get install -y librsvg2-bin binaryen
        rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
        rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
        rsvg-convert -w 180 -h 180 icon.svg -o icon-180.png

    - name: Assemble site
      shell: bash
      env:
        GIT_REV: ${{ inputs.revision }}
      run: |
        mkdir -p site
        cp index.html site/
        cp manifest.json site/
        cp icon-512.png icon-192.png icon-180.png site/
        cp mq_js_bundle.js site/
        # Shrink the wasm (~30% on top of the size-tuned release profile).
        wasm-opt -Oz -o site/harbour-sim.wasm target/wasm32-unknown-unknown/release/harbour-sim.wasm
        # Inject the build's git revision (cache-buster + on-screen label)
        # and timestamp for the About overlay. ISO-8601 UTC: index.html
        # re-renders it in the viewer's locale (same as Pegasus).
        BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        sed -i "s|__GIT_REVISION__|${GIT_REV}|g" site/index.html
        sed -i "s|__BUILD_TIME__|${BUILD_TIME}|g" site/index.html
        # Version marker for a future stale-cache check (cheap to keep).
        printf '{"revision":"%s"}\n' "${GIT_REV}" > site/version.json
