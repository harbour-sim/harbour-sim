name: Publish Pages

# The ONLY workflow that actually deploys to GitHub Pages. It snapshots the
# gh-pages state branch (root = main build, pr-<n>/ = live previews) and
# publishes the whole tree as the Pages artifact.
#
# Why the indirection: the auto-created `github-pages` environment only allows
# deployments from `main`, so a pull_request-triggered workflow can't call
# deploy-pages itself. `workflow_run` workflows always execute from the
# default branch, so this passes the environment protection for previews and
# main alike — no repo settings changes needed. Also: pushes made with
# GITHUB_TOKEN don't trigger `push` workflows (recursion guard), so an
# `on: push: branches: [gh-pages]` publisher would never fire — workflow_run
# is load-bearing, not a style choice. Keep Settings → Pages → Source on
# "GitHub Actions".
#
# The workflow names below must match the `name:` of deploy.yml,
# preview-deploy.yml and preview-teardown.yml exactly — a workflow that
# pushes to gh-pages without being listed here lands on the branch and is
# never deployed.

on:
  workflow_run:
    workflows:
      - "Main deploy"
      - "Preview deploy"
      - "Preview teardown"
    types: [completed]
  # Manual escape hatch: republish the current gh-pages state on demand
  # (e.g. after this file first lands on the default branch, when earlier
  # deploys completed without a publisher listening).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; only the newest snapshot matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # workflow_run: only publish after a successful deploy. workflow_dispatch
    # has no workflow_run payload, so it must pass explicitly.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      # upload-pages-artifact and deploy-pages are released as a pair
      # (deploy-pages v4+ only accepts artifacts from upload-pages-artifact
      # v3+) — move their majors together. From v4 on, upload-pages-artifact
      # drops dotfiles by default; include-hidden-files keeps the v3
      # behaviour (.nojekyll ships, .git/.github are still always excluded).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

      # The Pages API intermittently rejects deployments created in rapid
      # succession ("Deployment failed, try again later."). One retry after a
      # pause covers it; if the retry also fails, the run goes red and the
      # next branch event re-publishes anyway.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pause before retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 30

      - name: Retry deploy (transient Pages API failure)
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
